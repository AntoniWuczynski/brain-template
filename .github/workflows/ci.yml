name: CI

# One lean job — lint + typecheck + test on a single Ubuntu / Python 3.12
# runner. No version/OS matrix, no packaging: this is a personal-vault
# framework, not a product (see CLAUDE.md / .claude/CODEBASE.md).
#
# The path filters below mean this never runs on the constant `mcp(...)`
# vault-note commits the MCP server makes: those touch only knowledge/ etc.,
# never code, so they don't burn Actions minutes.

on:
  push:
    branches: [main]
    paths: &code-paths
      - "scripts/**"
      - "mcp_server/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/**"
  pull_request:
    paths: *code-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Guard — workflow actions are SHA-pinned
        run: bash scripts/check-action-pins.sh

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # --locked: fail rather than re-resolve if uv.lock is stale against
      # pyproject.toml. CI is the only place a forgotten `uv lock` gets
      # caught, and the lockfile (hashes + the 7-day cooldown) is the
      # supply-chain control — a bare `uv sync` would go green against
      # packages nobody committed.
      #
      # Skip torch + sentence-transformers: the tests monkeypatch the embedder
      # and mypy ignores those (stubless) SDKs, so the ~2 GB ML stack isn't
      # needed and CI stays fast. uv still installs everything else from the
      # locked env (numpy, the LLM SDKs mypy checks against, etc.).
      #
      # --no-install-package excludes only the named package, never its
      # dependency closure, so torch's CUDA transitives (~several GB of
      # linux-only nvidia-* wheels, plus triton and the cuda-* shims) would
      # still land on the Ubuntu runner. They are reachable from nothing but
      # torch, so exclude each by name. tests/test_supply_config.py keeps this
      # list in step with uv.lock.
      - name: Install dependencies
        run: |
          uv sync --locked \
            --no-install-package torch \
            --no-install-package sentence-transformers \
            --no-install-package triton \
            --no-install-package cuda-bindings \
            --no-install-package cuda-pathfinder \
            --no-install-package cuda-toolkit \
            --no-install-package nvidia-cublas \
            --no-install-package nvidia-cuda-cupti \
            --no-install-package nvidia-cuda-nvrtc \
            --no-install-package nvidia-cuda-runtime \
            --no-install-package nvidia-cudnn-cu13 \
            --no-install-package nvidia-cufft \
            --no-install-package nvidia-cufile \
            --no-install-package nvidia-curand \
            --no-install-package nvidia-cusolver \
            --no-install-package nvidia-cusparse \
            --no-install-package nvidia-cusparselt-cu13 \
            --no-install-package nvidia-nccl-cu13 \
            --no-install-package nvidia-nvjitlink \
            --no-install-package nvidia-nvshmem-cu13 \
            --no-install-package nvidia-nvtx

      - name: Lint (ruff)
        run: uv run --no-sync ruff check .

      - name: Typecheck (mypy)
        run: uv run --no-sync mypy scripts mcp_server tests

      - name: Test (pytest)
        run: uv run --no-sync pytest -q
